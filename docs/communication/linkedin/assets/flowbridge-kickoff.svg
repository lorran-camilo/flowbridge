<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">FlowBridge — projeto em planejamento</title>
  <desc id="svg-desc">Arte horizontal em azul-marinho e ciano. À esquerda, FlowBridge, Order Integration and Automation Platform, Building Learning and Engineering, e tecnologias planejadas Java, Spring Boot e Angular. À direita, diagrama conceitual: Angular chama a API Spring Boot; a API grava pedido, itens, idempotência e evento Outbox na mesma transação PostgreSQL; após commit, um Outbox Publisher independente consulta eventos pendentes no PostgreSQL e publica no RabbitMQ; o Worker processa integrações externas simuladas e atualiza o estado no PostgreSQL. Nenhum componente está implementado.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0B1E36"/>
      <stop offset="1" stop-color="#102B48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D6E8"/>
      <stop offset="1" stop-color="#4D8DFF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#A9C4D8" opacity="0.14"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35D6E8"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#73A9C8"/>
    </marker>
  </defs>

  <rect width="1200" height="627" fill="url(#background)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>
  <circle cx="1100" cy="55" r="210" fill="#35D6E8" opacity="0.045"/>
  <circle cx="560" cy="600" r="180" fill="#4D8DFF" opacity="0.055"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="60" y="54" width="8" height="20" rx="4" fill="url(#accent)"/>
    <text x="82" y="69" fill="#A9C4D8" font-size="14" font-weight="700" letter-spacing="2.2">PROJETO PESSOAL • JORNADA DE APRENDIZADO</text>

    <text x="58" y="170" fill="#F5FAFF" font-size="66" font-weight="750" letter-spacing="-2.4">FlowBridge</text>
    <rect x="62" y="191" width="88" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="62" y="235" fill="#D9EAF5" font-size="22" font-weight="500">Order Integration &amp;</text>
    <text x="62" y="265" fill="#D9EAF5" font-size="22" font-weight="500">Automation Platform</text>
    <text x="62" y="311" fill="#35D6E8" font-size="19" font-weight="650" letter-spacing="0.4">Building, Learning &amp; Engineering</text>

    <rect x="62" y="346" width="238" height="34" rx="17" fill="#143452" stroke="#35D6E8" stroke-opacity="0.65"/>
    <circle cx="81" cy="363" r="5" fill="#35D6E8"/>
    <text x="96" y="368" fill="#DDFBFF" font-size="13" font-weight="750" letter-spacing="1.3">EM PLANEJAMENTO</text>

    <text x="62" y="425" fill="#A9C4D8" font-size="13" font-weight="750" letter-spacing="1.7">TECNOLOGIAS PLANEJADAS</text>
    <g font-size="14" font-weight="650" text-anchor="middle">
      <rect x="62" y="442" width="83" height="38" rx="19" fill="#122C49" stroke="#3B5873"/>
      <text x="103.5" y="466" fill="#F5FAFF">Java</text>
      <rect x="154" y="442" width="157" height="38" rx="19" fill="#122C49" stroke="#3B5873"/>
      <text x="232.5" y="466" fill="#F5FAFF">Spring Boot</text>
      <rect x="320" y="442" width="102" height="38" rx="19" fill="#122C49" stroke="#3B5873"/>
      <text x="371" y="466" fill="#F5FAFF">Angular</text>
    </g>

    <line x1="62" y1="520" x2="420" y2="520" stroke="#55718B" stroke-opacity="0.55"/>
    <text x="62" y="548" fill="#A9C4D8" font-size="14">Planejar • estudar • construir com intenção</text>

    <rect x="584" y="48" width="556" height="530" rx="24" fill="#091A2D" fill-opacity="0.82" stroke="#284766" stroke-width="1.5"/>
    <text x="614" y="82" fill="#A9C4D8" font-size="13" font-weight="750" letter-spacing="1.7">ARQUITETURA CONCEITUAL</text>
    <text x="1110" y="82" fill="#35D6E8" font-size="12" font-weight="700" text-anchor="end" letter-spacing="1.1">PLANEJADA</text>

    <!-- Angular → API → PostgreSQL: pedido e Outbox são gravados no mesmo commit. -->
    <path d="M 770 142 H 812" fill="none" stroke="#35D6E8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 915 178 V 218" fill="none" stroke="#35D6E8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- Após o commit, Publisher lê a Outbox e publica no broker. -->
    <path d="M 778 267 H 820" fill="none" stroke="#35D6E8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 694 302 V 346" fill="none" stroke="#35D6E8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 778 381 H 812" fill="none" stroke="#35D6E8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 915 416 V 459" fill="none" stroke="#35D6E8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- Worker registra o resultado do processamento no banco compartilhado. -->
    <path d="M 1018 381 H 1107 V 286 H 1100" fill="none" stroke="#73A9C8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>
    <text x="1052" y="331" fill="#8FAFC7" font-size="10" text-anchor="middle">atualiza estado</text>

    <g>
      <rect x="620" y="106" width="150" height="72" rx="13" fill="#102B48" stroke="#35D6E8" stroke-opacity="0.8" stroke-width="1.5"/>
      <text x="695" y="136" fill="#F5FAFF" font-size="16" font-weight="700" text-anchor="middle">Angular</text>
      <text x="695" y="158" fill="#A9C4D8" font-size="12" text-anchor="middle">painel planejado</text>

      <rect x="812" y="106" width="206" height="72" rx="13" fill="#102B48" stroke="#35D6E8" stroke-opacity="0.8" stroke-width="1.5"/>
      <text x="915" y="136" fill="#F5FAFF" font-size="16" font-weight="700" text-anchor="middle">API</text>
      <text x="915" y="158" fill="#A9C4D8" font-size="12" text-anchor="middle">Spring Boot</text>

      <rect x="820" y="218" width="280" height="68" rx="13" fill="#102B48" stroke="#4D8DFF" stroke-opacity="0.85" stroke-width="1.5"/>
      <text x="960" y="243" fill="#F5FAFF" font-size="15" font-weight="700" text-anchor="middle">PostgreSQL</text>
      <text x="960" y="262" fill="#D9EAF5" font-size="11.5" text-anchor="middle">pedido + itens + idempotência + Outbox</text>
      <text x="960" y="278" fill="#35D6E8" font-size="10.5" font-weight="700" text-anchor="middle">UMA TRANSAÇÃO • COMMIT</text>

      <rect x="610" y="232" width="168" height="70" rx="13" fill="#102B48" stroke="#35D6E8" stroke-opacity="0.8" stroke-width="1.5"/>
      <text x="694" y="258" fill="#F5FAFF" font-size="14" font-weight="700" text-anchor="middle">Outbox Publisher</text>
      <text x="694" y="279" fill="#A9C4D8" font-size="10.5" text-anchor="middle">consulta Outbox após commit</text>

      <rect x="610" y="346" width="168" height="70" rx="13" fill="#102B48" stroke="#4D8DFF" stroke-opacity="0.85" stroke-width="1.5"/>
      <text x="694" y="375" fill="#F5FAFF" font-size="15" font-weight="700" text-anchor="middle">RabbitMQ</text>
      <text x="694" y="396" fill="#A9C4D8" font-size="11.5" text-anchor="middle">eventos e filas</text>

      <rect x="812" y="346" width="206" height="70" rx="13" fill="#102B48" stroke="#35D6E8" stroke-opacity="0.8" stroke-width="1.5"/>
      <text x="915" y="375" fill="#F5FAFF" font-size="15" font-weight="700" text-anchor="middle">Worker</text>
      <text x="915" y="396" fill="#A9C4D8" font-size="11.5" text-anchor="middle">processamento assíncrono</text>

      <rect x="812" y="459" width="206" height="65" rx="13" fill="#102B48" stroke="#4D8DFF" stroke-opacity="0.85" stroke-width="1.5"/>
      <text x="915" y="486" fill="#F5FAFF" font-size="13.5" font-weight="700" text-anchor="middle">Integrações externas</text>
      <text x="915" y="506" fill="#A9C4D8" font-size="11.5" text-anchor="middle">frete e faturamento simulados</text>
    </g>

    <text x="614" y="552" fill="#8FAFC7" font-size="12">Diagrama ilustrativo • componentes ainda não implementados</text>
  </g>
</svg>
