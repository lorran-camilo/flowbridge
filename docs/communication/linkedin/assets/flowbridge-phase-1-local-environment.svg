<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">FlowBridge — ambiente local e aprendizado</title>
  <desc id="desc">Diagrama horizontal em azul-marinho e ciano. O shell Angular inicial aparece separado de um grupo Docker Compose que contém PostgreSQL, RabbitMQ e Keycloak. Os três containers passaram seus health checks. A imagem ressalta que containers saudáveis não significam que a API já esteja integrada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.58" stop-color="#0B1E36"/>
      <stop offset="1" stop-color="#102B48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D6E8"/>
      <stop offset="1" stop-color="#4D8DFF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#A9C4D8" opacity="0.12"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#73A9C8"/>
    </marker>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>
  <circle cx="1100" cy="45" r="210" fill="#35D6E8" opacity="0.04"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="58" y="52" width="8" height="20" rx="4" fill="url(#accent)"/>
    <text x="80" y="67" fill="#A9C4D8" font-size="14" font-weight="700" letter-spacing="2">FLOWBRIDGE • PROJETO DE ESTUDO</text>

    <text x="58" y="143" fill="#F5FAFF" font-size="42" font-weight="750" letter-spacing="-1.2">Ambiente local no ar.</text>
    <text x="58" y="193" fill="#35D6E8" font-size="34" font-weight="700" letter-spacing="-0.8">Integração é outro passo.</text>
    <text x="60" y="231" fill="#A9C4D8" font-size="17">Entregas 1.4 e 1.5 • base executável e verificável</text>

    <rect x="60" y="274" width="240" height="132" rx="18" fill="#102B48" stroke="#35D6E8" stroke-opacity="0.78" stroke-width="1.5"/>
    <text x="84" y="311" fill="#A9C4D8" font-size="12" font-weight="700" letter-spacing="1.3">PAINEL WEB</text>
    <text x="84" y="351" fill="#F5FAFF" font-size="25" font-weight="700">Angular</text>
    <text x="84" y="380" fill="#A9C4D8" font-size="14">shell inicial • sem chamadas à API</text>

    <path d="M310 340H368" fill="none" stroke="#73A9C8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="338" y="324" fill="#8FAFC7" font-size="11" text-anchor="middle">a integrar</text>

    <rect x="382" y="244" width="286" height="193" rx="18" fill="#091A2D" fill-opacity="0.84" stroke="#284766" stroke-width="1.5"/>
    <text x="408" y="281" fill="#A9C4D8" font-size="12" font-weight="700" letter-spacing="1.3">BACKEND</text>
    <text x="408" y="326" fill="#F5FAFF" font-size="26" font-weight="700">Spring Boot</text>
    <text x="408" y="357" fill="#A9C4D8" font-size="14">API e worker: shells existentes</text>
    <text x="408" y="391" fill="#73E6F2" font-size="13" font-weight="650">dependências ainda não conectadas</text>

    <rect x="711" y="52" width="431" height="385" rx="22" fill="#091A2D" fill-opacity="0.85" stroke="#284766" stroke-width="1.5"/>
    <text x="741" y="88" fill="#A9C4D8" font-size="12" font-weight="700" letter-spacing="1.5">DOCKER COMPOSE • SERVIÇOS LOCAIS</text>
    <text x="1112" y="117" fill="#35D6E8" font-size="11" text-anchor="end" font-weight="700" letter-spacing="1">HEALTH CHECK OK</text>

    <g>
      <rect x="741" y="137" width="371" height="72" rx="13" fill="#102B48" stroke="#4D8DFF" stroke-opacity="0.75"/>
      <path d="M768 160h22v22h-22zM773 155h12M773 187h12" fill="none" stroke="#73E6F2" stroke-width="2" stroke-linecap="round"/>
      <text x="811" y="169" fill="#F5FAFF" font-size="17" font-weight="700">PostgreSQL</text>
      <text x="811" y="190" fill="#A9C4D8" font-size="12">permissões migration/runtime verificadas</text>

      <rect x="741" y="222" width="371" height="72" rx="13" fill="#102B48" stroke="#4D8DFF" stroke-opacity="0.75"/>
      <circle cx="779" cy="258" r="13" fill="none" stroke="#73E6F2" stroke-width="2"/>
      <path d="M766 258h26M779 245c5 6 5 20 0 26M779 245c-5 6-5 20 0 26" fill="none" stroke="#73E6F2" stroke-width="1.5"/>
      <text x="811" y="254" fill="#F5FAFF" font-size="17" font-weight="700">RabbitMQ</text>
      <text x="811" y="275" fill="#A9C4D8" font-size="12">broker local iniciou saudável</text>

      <rect x="741" y="307" width="371" height="72" rx="13" fill="#102B48" stroke="#4D8DFF" stroke-opacity="0.75"/>
      <circle cx="779" cy="343" r="13" fill="none" stroke="#73E6F2" stroke-width="2"/>
      <path d="M779 330v26M766 343h26M770 334l18 18M788 334l-18 18" fill="none" stroke="#73E6F2" stroke-width="1.5"/>
      <text x="811" y="339" fill="#F5FAFF" font-size="17" font-weight="700">Keycloak</text>
      <text x="811" y="360" fill="#A9C4D8" font-size="12">realm vazio • discovery OIDC verificada</text>
    </g>

    <rect x="60" y="474" width="1082" height="91" rx="18" fill="#102B48" stroke="#35D6E8" stroke-opacity="0.5"/>
    <rect x="60" y="474" width="7" height="91" rx="3.5" fill="url(#accent)"/>
    <text x="90" y="510" fill="#35D6E8" font-size="13" font-weight="750" letter-spacing="1.3">APRENDIZADO DE HOJE</text>
    <text x="90" y="541" fill="#F5FAFF" font-size="22" font-weight="700">Container saudável ≠ integração da aplicação</text>
    <text x="1110" y="541" fill="#A9C4D8" font-size="13" text-anchor="end">FlowBridge • Fase 1</text>
  </g>
</svg>
